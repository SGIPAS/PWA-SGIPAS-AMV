<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SGI Planta de Ácido - SGIPAS</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Adaptador de fechas para Chart.js (debe cargarse después de Chart.js) -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

    <link rel="manifest" href="/manifest.json">
    <style>
        #nav-sidebar::-webkit-scrollbar { width: 4px; }
        #nav-sidebar::-webkit-scrollbar-thumb { background-color: #4b5563; border-radius: 2px; }
        #nav-sidebar { scrollbar-width: thin; scrollbar-color: #4b5563 #1e293b; }
        
        .sidebar-closed {
            transform: translateX(-100%) !important;
            width: 0 !important;
            min-width: 0 !important;
            overflow: hidden !important;
            border-right-width: 0 !important;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 h-screen flex overflow-hidden font-sans">

    <button id="menu-toggle" class="fixed top-4 left-4 z-50 p-2 rounded-md bg-slate-700 text-white shadow-lg">
        ☰
    </button>

    <!-- BARRA LATERAL -->
    <aside id="sidebar" class="w-64 bg-[#1e293b] border-r border-slate-700 flex flex-col z-40 shadow-2xl fixed md:relative inset-y-0 left-0 transform transition-transform duration-300 ease-in-out sidebar-closed md:sidebar-closed">
        <!-- Logo como cabecera -->
        <div class="border-b border-slate-700 h-20 flex items-center justify-center">
            <img src="logo.png" alt="Logo AMV" class="h-full w-full object-contain" onerror="this.style.display='none'">
        </div>
        
        <div id="bloque-usuario" class="p-4 border-b border-slate-700 bg-slate-800">
            <div class="flex items-center space-x-3">
                <div class="h-10 w-10 rounded-full bg-blue-600 flex items-center justify-center text-white font-bold text-lg" id="avatar-inicial">U</div>
                <div class="flex-1 min-w-0">
                    <p class="text-sm font-semibold text-white truncate" id="usuario-nombre">Usuario</p>
                    <p class="text-xs text-slate-400 capitalize" id="usuario-rol">sin rol</p>
                </div>
            </div>
            <button id="btn-cambiar-password" class="mt-2 w-full text-left text-xs text-blue-400 hover:text-blue-300 transition">🔑 Cambiar contraseña</button>
        </div>

        <nav class="flex-1 p-4 space-y-3 overflow-y-auto" id="nav-sidebar">
            <!-- Panel de Indicadores (nuevo módulo) -->
            <button id="btn-nav-dashboard" class="w-full flex items-center justify-start p-3 rounded-md bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium transition-colors shadow-sm border border-slate-600">
                <span class="mr-3">📈</span> Panel de Indicadores
            </button>
            <button id="btn-nav-operaciones" class="w-full flex items-center justify-start p-3 rounded-md bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium transition-colors shadow-sm border border-slate-600">
                <span class="mr-3">📊</span> Control Operacional
            </button>
            <button id="btn-nav-ssl" class="w-full flex items-center justify-start p-3 rounded-md bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium transition-colors shadow-sm border border-slate-600">
                <span class="mr-3">⚠️</span> Seguridad (SSL)
            </button>
            <button id="btn-nav-biblioteca" class="w-full flex items-center justify-start p-3 rounded-md bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium transition-colors shadow-sm border border-slate-600">
                <span class="mr-3">📚</span> Biblioteca Documental
            </button>
            <button id="btn-nav-mtto" class="w-full flex items-center justify-start p-3 rounded-md bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium transition-colors shadow-sm border border-slate-600">
                <span class="mr-3">🔧</span> Mantenimiento / O.T.
            </button>
            <button id="btn-nav-bitacora" class="w-full flex items-center justify-start p-3 rounded-md bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium transition-colors shadow-sm border border-slate-600">
                <span class="mr-3">📝</span> Bitácora de Turno
            </button>
            <button id="btn-nav-usuarios" class="w-full flex items-center justify-start p-3 rounded-md bg-slate-700 hover:bg-slate-600 text-slate-200 font-medium transition-colors shadow-sm border border-slate-600">
                <span class="mr-3">👥</span> Gestión de Personal
            </button>
        </nav>
        <div id="sidebar-footer" class="p-4 border-t border-slate-700 space-y-2"></div>
    </aside>

    <main class="flex-1 flex flex-col bg-[#0f172a] relative overflow-hidden transition-all duration-300 ease-in-out">
        <div id="app-content" class="flex-1 overflow-y-auto p-8 pt-16 md:pt-8">
            <!-- Contenido dinámico -->
        </div>
    </main>

    <script type="module" src="js/main.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registrado:', reg.scope))
          .catch(err => console.log('SW falló:', err));
      }
    </script>
</body>
</html>
